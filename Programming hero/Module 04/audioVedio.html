<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and video</title>
</head>
<body>
    <!-- audio tag  -->
     <h2>This is my audio song</h2>
     <audio controls src="sandeshe_aate_hain.mp3"></audio>
<br>
     <!-- Recommended way  -->
      <audio controls>
        <source src="sandeshe_aate_hain.mp3" type="audio/mpeg">
      </audio>
<br>
      <!-- video tag  -->
       <video controls src="Freevideo.mp4" width="400"></video>
<br>
       <!-- Recommended way  -->
        <video controls width="400">
            <source src="Freevideo.mp4" type="video/mp4">
        </video>
<br>
        <!-- embed link  -->
         <iframe width="560" height="315" src="https://www.youtube.com/embed/qAk7Amq_N3U?si=Fc3uTQ-ZeZewMqUB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
