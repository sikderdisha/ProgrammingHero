<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
           border-collapse: collapse;
        }
        td,th{
            border: 2px solid green;
            padding: 10px 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
<h1>Tables</h1>

<tr>

</tr>

    <tbody>

        <tr>

        </tr>
        <!-- second row  -->
        <tr>
            <td>16832</td>

        </tr>
        <!-- third row  -->
        <tr>
            <td>16532</td>

        </tr>

    </tbody>

    <!-- table footer  -->
    <tfoot>
<td colspan="3">Total seat 32</td>

</table>
    </main>
    <footer>
<p><small> &copy;copyright</small></p>
    </footer>
</body>
</html>
