<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid black;
            padding: 5px;
            margin: 5px;
            width: 400px;
            height: 150px;
        }
        .dummy{
             border: 2px solid black;
            padding: 5px;
            margin: 5px;
            width: 400px;
            height: 150px;
        }
        .parent{
            border: 3px solid black;
            padding: 30px;
            margin: 40px;
        }
        .box1{
            background-color: aqua;
        }
        .box2{
            background-color: rgb(0, 255, 225);
            position: relative;
            top: -80px;
            left: 30px;
        }
        .box3{
            background-color: rgb(241, 66, 174);
            position: absolute;
            top: 50px;
            left: 600px;
        }
        .box4{
            background-color: rgb(66, 231, 93);
            position: sticky;
            top: 0px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1">static</div>
     <div class="box box2">relative</div>
      <div class="box box3">absolute</div>
       <div class="box box4">sticky</div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
       <div class="dummy"></div>
    </div>
</body>
</html>
