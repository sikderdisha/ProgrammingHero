<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3{
            background-color: aquamarine;
        }
        /*hover means mouse over*/
        h3:hover{
            color: brown;
            font-weight: bold;
        }
        /*focus*/
        input:focus{
            background-color: aliceblue;
            border: none;
            color: blue;
        }
        a:visited{
            color: blueviolet;
            text-decoration: none;
        
        }
        li:nth-child(2n){
            background-color: bisque;
        }
        li:nth-child(2n+1){
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    <h3>Hover</h3>
    <input type="text">
    <br>
    <a href="https://www.figma.com/color-palettes/">color plate</a>
     <ul>
        <li>apple</li>
        <li>orange</li>
        <li>Guava</li>
        <li>grave</li>
     </ul>
</body>
</html>
