<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: rgb(186, 142, 226);
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3,150px);        
        }
        .long-green{
            grid-row: span 3;
            background-color: greenyellow;
        }
        .green{
           grid-column: span 2;
           background-color: greenyellow;
        }
        .green-t{
            grid-row: span 2;
            background-color: greenyellow;

        }
        .normal{
            grid-column: span 1;
            grid-row: span 1;
            background-color: rgb(233, 109, 38);
        }
    </style>
</head>
<body>
    <!-- .container>.card{box - $}*8 -->
    <div class="container">
        <div class="card long-green" >box - 1</div>
        <div class="card green">box - 2</div>
        <div class="card normal">box - 3</div>
        <div class="card normal">box - 4</div>
        <div class="card normal">box - 5</div>
        <div class="card green-t">box - 6</div>
        <div class="card normal">box - 7</div>
        <div class="card normal">box - 8</div>
    </div>
</body>
</html>
