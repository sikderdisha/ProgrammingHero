<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3,200px) 50px 50px;
            gap: 10px;
            
        }
        .box{
            background-color: aqua;
        }
        #long-box{
            grid-row: span 5;

        }
        #wide{
            grid-row: span 1;
            grid-column: span 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="long-box" class="box">div1</div>
        <div class="box">div2</div>
        <div class="box">div3</div>
        <div class="box">div4</div>
        <div class="box">div5</div>
        <div class="box">div6</div>
        <div class="box">div7</div>
        <div class="box">div8</div>
        <div class="box">div9</div>
        <div class="box">div10</div>
        <div class="box" id="wide">div11</div>
        <div class="box" id="wide">div12</div>
    </div>
</body>
</html>
