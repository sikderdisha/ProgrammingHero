<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <STyle>
        .container{
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(6,1fr);
            grid-template-rows: repeat(6,200px);
        }
        img{
            width: 100%;
            height: 100%;
        }
        .big-layout{
            grid-column: span 6;
            grid-row: span 2;
        }
        .normal-layout{
            grid-column: span 2;
            grid-row: span 2;
        }
        .mixed-layout{
            grid-column: span 2;
            grid-row: span 1;
        }

        /*responsive*/
        @media screen and (max-width:576px){
            .container{
                /*display: block;*/
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2,1fr);
            }
            .big-layout,.mixed-layout,.normal-layout{
                /*take the place it needs*/
                grid-row: span 1;
                grid-column: span 1;
            }
        }
    </STyle>
</head>
<body>
    <div class="container">
        <div class="big-layout">
            <img src="./Images/A.jpg" alt="">
        </div>
        <div class="normal-layout">
            <img src="./Images/B.jpg" alt="">
        </div>
        <div class="normal-layout">
            <img src="./Images/C.jpg" alt="">
        </div>
        <div class="mixed-layout">
            <img src="./Images/D.jpg" alt="">
        </div>
        <div class="mixed-layout">
            <img src="./Images/E.jpg" alt="">
        </div>
        <div class="normal-layout">
            <img src="./Images/F.jpg" alt="">
        </div>
        <div>
            <img src="./Images/G.jpg" alt="">
        </div>
        <div>
            <img src="./Images/G.jpg" alt="">
        </div>

        <div class="normal-layout">
            <img src="./Images/I.jpg" alt="">
        </div>
<!-- again use same img  -->
        <div>
            <img src="./Images/G.jpg" alt="">
        </div>
        <div>
            <img src="./Images/G.jpg" alt="">
        </div>
    </div>
</body>
</html>
